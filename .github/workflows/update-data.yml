# Keeps data/ current with the live Forever build and its hotfixes. See docs/update-runbook.md.
name: Update data
on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, like wowsims/gamedata
  workflow_dispatch:
    inputs:
      force:
        description: "Scan even if nothing looks new"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write   # to start the Site workflow after merging (see the last step)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Check for a new build or hotfix push
        id: check
        run: python3 pipeline/builds.py check --cache-out "$RUNNER_TEMP/DBCache.bin" --github-output

      - name: Run tests
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: python3 -m unittest discover -s pipeline/tests

      - name: Check out db2tool (pinned in scan/forever-ref.txt)
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: |
          git clone --filter=blob:none https://github.com/wowsims/forever.git "$RUNNER_TEMP/forever"
          git -C "$RUNNER_TEMP/forever" checkout "$(cat scan/forever-ref.txt)"

      # Pinned to the newest stable Go, not the forever repo's go.mod (1.25, end of life since 2026-08-19).
      # Output verified identical to 1.25.4 across all tables; see docs/update-runbook.md "Dependencies".
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.check.outputs.changed == 'true' || inputs.force
        with:
          go-version: "1.27.3"
          cache: false

      - name: Scan and ingest
        id: scan
        if: steps.check.outputs.changed == 'true' || inputs.force
        env:
          FOREVER_REPO: ${{ runner.temp }}/forever
          SCAN_WORK: ${{ runner.temp }}/scan
        run: |
          scripts/scan.sh --cdn
          if grep -q "Needs review" "$SCAN_WORK/summary.md"; then echo "review=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open a pull request
        if: steps.check.outputs.changed == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ runner.temp }}/scan/summary.md
        run: |
          if git diff --quiet -- data; then echo "No data changes."; exit 0; fi
          VERSION="$(python3 -c "import json;s=json.load(open('data/state.json'));print(f\"{s['version']}-push{s['hotfixPush']}\")")"
          BRANCH="data/$VERSION"
          git config user.name "forever-db bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data
          git commit -m "data: $VERSION"
          # The branch is the bot's own; a re-run after a failure replaces it.
          git push --force -u origin "$BRANCH"
          LABEL=""
          if [ "${{ steps.scan.outputs.review }}" = "true" ]; then
            gh label create needs-review --color d93f0b --description "Ingest looks like a tool/schema problem" 2>/dev/null || true
            LABEL="--label needs-review"
          fi
          if ! PR_URL="$(gh pr create --base main --head "$BRANCH" --title "data: $VERSION" --body-file "$SUMMARY" $LABEL)"; then
            echo "::error::Could not open the pull request. If it says Actions may not create pull requests, enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."
            exit 1
          fi
          echo "Opened $PR_URL"
          if [ -n "$LABEL" ]; then
            echo "::notice::Flagged for review, so it was left open: $PR_URL"
            exit 0
          fi
          # Routine update: merge now. (Not `--auto`: with nothing for GitHub to wait on, it refuses auto-merge.)
          if gh pr merge "$BRANCH" --squash --delete-branch; then
            # A merge made with the workflow's token does not start other workflows, so the site build/deploy is
            # started explicitly (workflow_dispatch is the one trigger that is allowed).
            gh workflow run site.yml --ref main
          else
            echo "::warning::Could not merge $PR_URL (a branch protection rule?). It stays open: merge it by hand, then run the Site workflow."
          fi
